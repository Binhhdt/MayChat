name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# "write" is needed only for the unpack step below, which commits the
# unpacked source files back into this repository.
permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Phone-friendly upload: if a .zip file sits at the top of the repository,
      # unpack it into the repository, delete the zip and commit the result.
      # The .github folder inside a zip is ignored on purpose: the automatic
      # token is not allowed to change workflow files.
      - name: Unpack uploaded source zip (if any)
        run: |
          shopt -s nullglob dotglob
          zips=(*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "No zip file at the top of the repository. Nothing to unpack."
            exit 0
          fi
          for z in "${zips[@]}"; do
            echo "Unpacking: $z"
            tmp="$(mktemp -d)"
            unzip -q -o "$z" -d "$tmp"
            src="$tmp"
            entries=("$tmp"/*)
            if [ ${#entries[@]} -eq 1 ] && [ -d "${entries[0]}" ]; then
              src="${entries[0]}"
            fi
            rm -rf "$src/.github" "$src/.git"
            cp -a "$src"/. .
            rm -f "$z"
            rm -rf "$tmp"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Unpack source from uploaded zip"
            git push
          fi

      - name: Check that the project files exist
        run: |
          if [ ! -f settings.gradle.kts ]; then
            echo "::error::settings.gradle.kts not found. Upload MayChat.zip to the top of the repository, then run this workflow again."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null || true
            "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          else
            echo "::notice::sdkmanager not found at the usual path. The Android Gradle Plugin will download missing SDK packages itself."
          fi

      - name: Set up Gradle 9.4.1 (with caching)
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.4.1"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: MayChat-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
