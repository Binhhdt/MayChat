name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# "write" is needed only for the unpack step below, which commits the
# unpacked source files back into this repository.
permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Phone-friendly upload: if a .zip file sits at the top of the repository,
      # unpack it into the repository, delete the zip and commit the result.
      # The .github folder inside a zip is ignored on purpose: the automatic
      # token is not allowed to change workflow files.
      # A zip may contain a file named ".maychat-delete" listing old files
      # (one path per line) that must be removed from the repository.
      - name: Unpack uploaded source zip (if any)
        run: |
          shopt -s nullglob dotglob
          zips=(*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "No zip file at the top of the repository. Nothing to unpack."
            exit 0
          fi
          for z in "${zips[@]}"; do
            echo "Unpacking: $z"
            tmp="$(mktemp -d)"
            unzip -q -o "$z" -d "$tmp"
            src="$tmp"
            entries=("$tmp"/*)
            if [ ${#entries[@]} -eq 1 ] && [ -d "${entries[0]}" ]; then
              src="${entries[0]}"
            fi
            rm -rf "$src/.github" "$src/.git"
            if [ -f "$src/.maychat-delete" ]; then
              while IFS= read -r line || [ -n "$line" ]; do
                path="$(printf '%s' "$line" | tr -d '\r')"
                case "$path" in
                  ""|"#"*|/*|*..*|.git*) continue ;;
                esac
                echo "Removing old file: $path"
                rm -rf -- "$path"
              done < "$src/.maychat-delete"
              rm -f "$src/.maychat-delete"
            fi
            cp -a "$src"/. .
            rm -f "$z"
            rm -rf "$tmp"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Unpack source from uploaded zip"
            git push
          fi

      - name: Check that the project files exist
        run: |
          if [ ! -f settings.gradle.kts ]; then
            echo "::error::settings.gradle.kts not found. Upload MayChat.zip to the top of the repository, then run this workflow again."
            exit 1
          fi

      # The app needs the Supabase address and publishable key at build time.
      # They are stored in GitHub Secrets, never in the source code.
      - name: Check Supabase secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if grep -q "SUPABASE_URL" app/build.gradle.kts; then
            if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
              echo "::error::Missing GitHub secret SUPABASE_URL or SUPABASE_KEY. Add both in Settings > Secrets and variables > Actions, then run this workflow again."
              exit 1
            fi
            case "$SUPABASE_URL" in
              https://*.supabase.co*) ;;
              *) echo "::error::SUPABASE_URL must look like https://xxxxxxxx.supabase.co"; exit 1 ;;
            esac
            case "$SUPABASE_KEY" in
              sb_secret_*) echo "::error::SUPABASE_KEY is a SECRET key. Use the publishable key (sb_publishable_...) instead, and delete this secret key in Supabase."; exit 1 ;;
            esac
            echo "Supabase secrets are present."
          else
            echo "This version of the app does not use Supabase yet."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null || true
            "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          else
            echo "::notice::sdkmanager not found at the usual path. The Android Gradle Plugin will download missing SDK packages itself."
          fi

      - name: Set up Gradle 9.4.1 (with caching)
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.4.1"

      # Each secret the build needs is passed by name.
      - name: Build debug APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: MayChat-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
